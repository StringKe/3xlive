<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>3X Live</title>

    <!-- SEO -->
    <meta
      name="description"
      content="3X Live 是一款浏览器弹幕生存 Roguelite 游戏。击杀无尽怪物浪潮，收集 Disc 与 Program，叠加词条，挑战极限生存。"
    />
    <meta
      name="keywords"
      content="3xlive, 弹幕, 生存游戏, roguelite, 浏览器游戏, vampire survivors"
    />
    <link rel="canonical" href="https://3xlive.app" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://3xlive.app" />
    <meta property="og:site_name" content="3X Live" />
    <meta property="og:title" content="3X Live — 弹幕生存 Roguelite" />
    <meta
      property="og:description"
      content="击杀无尽怪物浪潮，收集 Disc 与 Program，叠加词条，挑战极限生存。"
    />
    <meta property="og:image" content="https://3xlive.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="3X Live — 弹幕生存 Roguelite" />
    <meta
      name="twitter:description"
      content="击杀无尽怪物浪潮，收集 Disc 与 Program，叠加词条，挑战极限生存。"
    />
    <meta name="twitter:image" content="https://3xlive.app/og-image.png" />

    <!-- Mobile / PWA -->
    <meta name="theme-color" content="#080c16" />
    <meta name="robots" content="index, follow" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Clerk -->
    <meta name="clerk-key" content="%VITE_CLERK_PUBLISHABLE_KEY%" />

    <!-- Cloudflare Turnstile (隐式模式，异步加载) -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #080c16;
      }
      #game-canvas {
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <!-- Loading 层：WASM 初始化前显示，资源加载完成后移除 -->
    <div
      id="loading-screen"
      style="
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #080c16;
        color: #00e4ff;
        font-family: system-ui, sans-serif;
      "
    >
      <div style="font-size: 2rem; font-weight: bold; margin-bottom: 1rem">3X LIVE</div>
      <div id="loading-text" style="font-size: 0.875rem; color: #888">Loading...</div>
      <div
        style="
          width: 200px;
          height: 4px;
          background: #1a1f2e;
          border-radius: 2px;
          margin-top: 0.75rem;
        "
      >
        <div
          id="loading-bar"
          style="
            width: 0%;
            height: 100%;
            background: #00e4ff;
            border-radius: 2px;
            transition: width 0.2s;
          "
        ></div>
      </div>
    </div>
    <canvas id="game-canvas" style="display: block; width: 100%; height: 100%"></canvas>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
